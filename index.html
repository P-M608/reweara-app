     storageBucket: "reweara-xxxx.firebasestorage.app",

/* ---------- ไอคอน (SVG วาดเอง ไม่ต้องโหลดไลบรารี) ---------- */

function icon(name, size = 22, extra = '') {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name] || ''}</svg>`;
}
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 22);
  });
}

/* ---------- กันโค้ดแปลกปลอมจากข้อความที่ผู้ใช้พิมพ์ ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* =====================================================================
   ที่เก็บข้อมูลในเครื่อง (IndexedDB = ฐานข้อมูลเล็ก ๆ ในเบราว์เซอร์)
   ใช้เมื่อยังไม่ได้ตั้งค่า Firebase และใช้ตรวจหาข้อมูลเก่าเพื่อย้ายขึ้น Cloud
   ===================================================================== */
const LocalStore = {
  db: null,
  memory: new Map(), // สำรองกรณีเบราว์เซอร์ไม่อนุญาตให้เก็บข้อมูล (เช่น โหมดไม่ระบุตัวตนบางแบบ)
  async open(silent = false) {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('reweara', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('items', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) {
      this.db = null;
      if (!silent) toast('เบราว์เซอร์นี้ไม่ให้เก็บข้อมูล — ข้อมูลจะหายเมื่อปิดหน้า', 'warn');
    }
  },
  _req(mode, fn) {
    return new Promise((res, rej) => {
      const store = this.db.transaction('items', mode).objectStore('items');
      const r = fn(store);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async all()      { return this.db ? this._req('readonly', s => s.getAll()) : [...this.memory.values()]; },
  async put(item)  { return this.db ? this._req('readwrite', s => s.put(item)) : this.memory.set(item.id, item); },
  async remove(id) { return this.db ? this._req('readwrite', s => s.delete(id)) : this.memory.delete(id); },
  async clear()    { return this.db ? this._req('readwrite', s => s.clear()) : this.memory.clear(); }
};

/* =====================================================================
   Firebase (ล็อกอิน + ฐานข้อมูลบน Cloud)
   ===================================================================== */
const Cloud = { A: null, F: null, auth: null, db: null, user: null, busy: false };
const USE_EMULATOR = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('emulator');

async function loadFirebase() {
  const [appM, A, F] = await Promise.all([
    import(`${FIREBASE_SDK}/firebase-app.js`),
    import(`${FIREBASE_SDK}/firebase-auth.js`),
    import(`${FIREBASE_SDK}/firebase-firestore.js`)
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  auth.languageCode = 'th';
  let db;
  try {
    // เก็บสำเนาไว้ในเครื่องด้วย → เปิดแอปเร็วขึ้น และใช้งานตอนเน็ตหลุดได้
    db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  } catch {
    db = F.getFirestore(app);
  }
  if (USE_EMULATOR) {
    A.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(db, '127.0.0.1', 8080);
  }
  Object.assign(Cloud, { A, F, auth, db });
}

// รอผลจาก Cloud ไม่เกิน 5 วินาที ถ้าเน็ตช้า/หลุด ข้อมูลจะถูกส่งขึ้นเองเมื่อกลับมาออนไลน์
const withTimeout = (p, ms = 5000) => Promise.race([p, new Promise(res => setTimeout(() => res('queued'), ms))]);

const CloudStore = {
  col() { return Cloud.F.collection(Cloud.db, 'users', Cloud.user.uid, 'items'); },
  async all() { return (await Cloud.F.getDocs(this.col())).docs.map(d => d.data()); },
  async put(item) { return withTimeout(Cloud.F.setDoc(Cloud.F.doc(this.col(), item.id), item)); },
  async remove(id) { return withTimeout(Cloud.F.deleteDoc(Cloud.F.doc(this.col(), id))); },
  async clear() {
    const F = Cloud.F;
    const snap = await F.getDocs(this.col());
    for (let i = 0; i < snap.docs.length; i += 400) {   // ลบทีละชุด (จำกัด 500 ต่อครั้ง)
      const b = F.writeBatch(Cloud.db);
      snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
      await b.commit();
    }
  }
};

// ตัวที่แอปใช้อยู่จริง: Cloud เมื่อล็อกอินแล้ว, ในเครื่องเมื่อยังไม่ได้ตั้งค่า Firebase
let Store = LocalStore;
const cloudMode = () => !!FIREBASE_CONFIG;

/* ---------- สถานะของแอป ---------- */
const state = {
  items: [],
  filters: { cat: 'all', colors: new Set(), styles: new Set(), fav: false, q: '', more: false },
  draft: null   // เสื้อผ้าที่กำลังเพิ่ม/แก้ไข
};

/* =====================================================================
   การสลับหน้า (ใช้ # ท้ายลิงก์ เช่น #wardrobe เพื่อให้ปุ่มย้อนกลับใช้ได้)
   ===================================================================== */
const PAGES = ['home', 'wardrobe', 'shop', 'profile'];
const currentPage = () => { const h = location.hash.slice(1); return PAGES.includes(h) ? h : 'home'; };
function go(page) { if (location.hash.slice(1) === page) render(); else location.hash = page; }
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

function render() {
  const page = currentPage();
  document.querySelectorAll('[data-page]').forEach(s => s.classList.toggle('hidden', s.dataset.page !== page));
  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.to === page;
    b.classList.toggle('text-olive-dark', on);
    b.classList.toggle('text-muted', !on);
    b.classList.toggle('font-semibold', on);
  });
  ({ home: renderHome, wardrobe: renderWardrobe, shop: renderShop, profile: renderProfile })[page]();
  hydrateIcons();
}

/* =====================================================================
   หน้า 1: HOME
   ===================================================================== */
function greeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'อรุณสวัสดิ์';
  if (h >= 12 && h < 17) return 'สวัสดีตอนบ่าย';
  if (h >= 17 && h < 22) return 'สวัสดีตอนเย็น';
  return 'ราตรีสวัสดิ์';
}

function firstName() {
  const n = Cloud.user?.displayName || '';
  return n.split(/\s+/)[0] || '';
}

function itemMatches(it, f) {
  if (f.cat !== 'all' && it.category !== f.cat) return false;
  if (f.fav && !it.favorite) return false;
  if (f.colors.size && !it.colors.some(c => f.colors.has(c))) return false;
  if (f.styles.size && !it.styles.some(s => f.styles.has(s))) return false;
  if (f.q) {
    const cat = byId(CATEGORIES, it.category);
    const hay = [
      it.name, it.brand, it.size, cat?.th, cat?.en,
      ...it.colors.map(c => byId(COLORS, c)?.th),
      ...it.styles.flatMap(s => { const st = byId(STYLES, s); return [st?.en, st?.th]; })
    ].join(' ').toLowerCase();
    if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}

function renderWardrobe() {
  const f = state.filters;
  const list = state.items.filter(it => itemMatches(it, f)).sort((a, b) => b.createdAt - a.createdAt);
  const countBy = id => state.items.filter(it => it.category === id).length;
  const activeExtra = f.colors.size + f.styles.size + (f.fav ? 1 : 0);
  const anyFilter = f.cat !== 'all' || activeExtra || f.q;

  document.getElementById('page-wardrobe').innerHTML = `
    <header class="flex items-end justify-between fade-in">
      <div>
        <h1 class="font-display text-3xl leading-none">My Wardrobe</h1>
        <p class="text-sm text-muted mt-1">ตู้เสื้อผ้าของฉัน · ${state.items.length} ชิ้น</p>
      </div>
      <button data-action="addToCloset" class="btn-primary !py-2.5 !px-4 text-sm flex items-center gap-1.5">${icon('plus', 18)} เพิ่ม</button>
    </header>
    ${guestNudgeHTML()}

    <div class="mt-4 flex gap-2">
      <form data-submit="wardrobeSearch" class="relative flex-1">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted">${icon('search', 18)}</span>
        <input id="wardrobe-search" type="search" value="${esc(f.q)}" placeholder="ค้นหา เช่น เชิ้ต เบจ, Uniqlo" style="padding-left:2.6rem" enterkeyhint="search">
      </form>
      <button data-action="toggleMore" aria-label="ตัวกรองเพิ่มเติม"
        class="relative shrink-0 w-12 rounded-2xl border ${f.more || activeExtra ? 'bg-olive text-white border-olive' : 'bg-linen border-sand'} grid place-items-center">
        ${icon('filter')}
        ${activeExtra ? `<span class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-clay text-white text-[11px] grid place-items-center">${activeExtra}</span>` : ''}
      </button>
    </div>

    <div class="mt-3 flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
      <button data-action="filterCat" data-id="all" class="chip ${f.cat === 'all' ? 'on' : ''}">ทั้งหมด <span class="opacity-70">${state.items.length}</span></button>
      ${CATEGORIES.map(c => `<button data-action="filterCat" data-id="${c.id}" class="chip ${f.cat === c.id ? 'on' : ''}">${c.th} <span class="opacity-70">${countBy(c.id)}</span></button>`).join('')}
    </div>

    ${f.more ? `
    <div class="mt-3 rounded-3xl bg-linen border border-sand p-4 fade-in">
      <div class="flex items-center justify-between">
        <p class="text-sm font-medium">สี</p>
        ${anyFilter ? `<button data-action="clearFilters" class="text-xs text-olive-dark underline">ล้างตัวกรองทั้งหมด</button>` : ''}
      </div>
      <div class="mt-2 flex flex-wrap gap-2.5">
        ${COLORS.map(c => `<button data-action="filterColor" data-id="${c.id}" title="${c.th}" aria-label="${c.th}" class="swatch ${f.colors.has(c.id) ? 'on' : ''}" style="background:${c.hex};${c.dark ? '--tick:#3E3730' : ''}"></button>`).join('')}

      </div>
      <label class="mt-4 flex items-center gap-2 text-sm cursor-pointer select-none">
        <input type="checkbox" data-change="filterFav" ${f.fav ? 'checked' : ''} class="w-4 h-4 accent-[#7A8B6F]"> แสดงเฉพาะชิ้นที่ชอบ ♥
      </label>
    </div>` : ''}

    ${state.items.length === 0 ? `
      <div class="mt-10 text-center px-6 fade-in">
        <div class="mx-auto w-20 h-20 rounded-full bg-sand grid place-items-center text-clay">${icon('hanger', 36)}</div>

        <p class="text-sm text-muted mt-1">ถ่ายรูปเสื้อผ้าชิ้นแรกเพื่อเริ่มสร้างตู้ดิจิทัลของคุณ</p>

    `}
  `;
}

function itemCard(it) {
  const cat = byId(CATEGORIES, it.category);
  return `
    <article class="group fade-in">
      <div class="relative rounded-3xl overflow-hidden bg-sand aspect-[3/4]">
        <button data-action="openItem" data-id="${it.id}" class="absolute inset-0 w-full h-full" aria-label="ดูรายละเอียด ${esc(it.name || cat?.th)}">
          <img src="${it.image}" alt="" loading="lazy" class="w-full h-full object-cover transition duration-300 group-hover:scale-[1.03]">
        </button>
        <button data-action="toggleFav" data-id="${it.id}" aria-label="ชอบ"
          class="absolute top-2.5 right-2.5 w-9 h-9 rounded-full bg-white/85 backdrop-blur grid place-items-center ${it.favorite ? 'text-alert' : 'text-ink/70'}">
          ${icon('heart', 18, it.favorite ? 'fill="currentColor"' : '')}
        </button>
      </div>
      <div class="mt-2 px-1 flex items-center gap-2">
        <div class="flex -space-x-1">
          ${it.colors.slice(0, 3).map(c => `<span class="w-3.5 h-3.5 rounded-full border border-white" style="background:${byId(COLORS, c)?.hex}"></span>`).join('')}
        </div>
        <p class="text-sm truncate">${esc(it.name || cat?.th || '')}</p>
      </div>
      ${it.brand ? `<p class="px-1 text-xs text-muted truncate">${esc(it.brand)}</p>` : ''}
    </article>`;
}

/* ---------- กล้อง ----------
   มือถือ/แท็บเล็ต: เปิดแอปกล้องของเครื่องโดยตรง (เร็วและเสถียรที่สุด)
   คอมพิวเตอร์: เปิดกล้องเว็บแคมในหน้าเว็บ */
const isTouchDevice = () => window.matchMedia('(pointer: coarse)').matches;

async function takePhoto() {
  if (isTouchDevice() || !navigator.mediaDevices?.getUserMedia) {
    document.getElementById('file-camera').click();
    return;
  }
  openModal(`
    <div class="p-4">
      <div class="flex items-center justify-between"><h2 class="font-semibold">ถ่ายรูปเสื้อผ้า</h2>${closeBtn}</div>
      <div class="mt-3 relative rounded-3xl overflow-hidden bg-ink aspect-[3/4] sm:aspect-[4/3]">
        <video id="cam-video" playsinline muted autoplay class="w-full h-full object-cover"></video>
        <div id="cam-msg" class="absolute inset-0 grid place-items-center text-white/80 text-sm p-6 text-center">กำลังเปิดกล้อง...</div>
      </div>
      <div class="mt-4 flex items-center justify-center gap-6">
        <button data-action="pickFile" class="w-12 h-12 rounded-full bg-linen border border-sand grid place-items-center" aria-label="เลือกจากเครื่อง">${icon('image')}</button>
        <button data-action="capture" id="cam-shoot" disabled class="w-[4.5rem] h-[4.5rem] rounded-full bg-olive ring-4 ring-olive-soft disabled:opacity-40" aria-label="ถ่าย"></button>
        <button data-action="flipCamera" class="w-12 h-12 rounded-full bg-linen border border-sand grid place-items-center" aria-label="สลับกล้อง">${icon('flip')}</button>
      </div>
    </div>`, { full: true });
  await startCamera();
}

async function startCamera() {
  stopCamera();
  const video = document.getElementById('cam-video');
  const msg = document.getElementById('cam-msg');
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: cameraFacing }, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false
    });
    if (!video) return stopCamera(); // ผู้ใช้ปิดหน้าต่างไปก่อน
    video.srcObject = cameraStream;
    await video.play();
    msg.classList.add('hidden');
    document.getElementById('cam-shoot').disabled = false;
  } catch (e) {
    if (msg) msg.innerHTML = `เปิดกล้องไม่ได้ (อาจยังไม่ได้อนุญาตให้ใช้กล้อง)<br><button data-action="pickFile" class="mt-3 btn-ghost !text-ink text-sm">เลือกรูปจากเครื่องแทน</button>`;
  }
}
function stopCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}
function capture() {
  const v = document.getElementById('cam-video');
  if (!v || !v.videoWidth) return;
  const dataUrl = drawScaled(v, v.videoWidth, v.videoHeight);
  stopCamera();
  openEditor({ image: dataUrl });
}

/* ---------- ย่อรูปให้เล็กลง (โหลดเร็ว + ประหยัดที่เก็บ) ---------- */
// ฐานข้อมูลรับได้ไม่เกิน ~1MB ต่อชิ้น จึงย่อจนรูปเล็กกว่า ~700KB เสมอ
const MAX_IMAGE_CHARS = 700000;
function drawScaled(src, w, h) {
  const tries = [[900, 0.82], [900, 0.7], [750, 0.7], [600, 0.65], [480, 0.6]];
  let out = '';
  for (const [max, q] of tries) {
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length < MAX_IMAGE_CHARS) break;
  }
  return out;
}
function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { try { res(drawScaled(img, img.naturalWidth, img.naturalHeight)); } finally { URL.revokeObjectURL(url); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้')); };
    img.src = url;
  });
}
async function onFilePicked(e) {
  const file = e.target.files?.[0];
  e.target.value = ''; // ให้เลือกไฟล์เดิมซ้ำได้
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('กรุณาเลือกไฟล์รูปภาพ', 'warn');
  try {
    const image = await fileToDataUrl(file);
    if (state.draft && state.draft.replacing) { state.draft.image = image; state.draft.replacing = false; renderEditor(); }
    else openEditor({ image });
  } catch {
    toast('อ่านรูปนี้ไม่ได้ ลองรูปอื่น (แนะนำ JPG หรือ PNG)', 'warn');
  }
}
document.getElementById('file-camera').addEventListener('change', onFilePicked);
document.getElementById('file-gallery').addEventListener('change', onFilePicked);

/* =====================================================================
   หน้าต่างเพิ่ม/แก้ไขเสื้อผ้า
   (ขั้นที่ 3 AI จะเติมประเภท สี สไตล์ให้อัตโนมัติ — ตอนนี้ผู้ใช้เลือกเอง)
   ===================================================================== */
function openEditor(item) {
  state.draft = {
    id: item.id || null, image: item.image,
    category: item.category || null, colors: [...(item.colors || [])], styles: [...(item.styles || [])],
    name: item.name || '', brand: item.brand || '', size: item.size || '',
    favorite: !!item.favorite, createdAt: item.createdAt || null
  };
  openModal('<div id="editor"></div>', { full: true });
  renderEditor();
}

        <p class="text-sm font-medium">ประเภท <span class="text-alert">*</span></p>
        <div class="mt-2 flex flex-wrap gap-2">

        </div>

        <p class="text-sm font-medium">สี <span class="text-alert">*</span> <span class="text-xs text-muted font-normal">เลือกได้หลายสี${d.colors.length ? ' · ' + d.colors.map(c => byId(COLORS, c).th).join(', ') : ''}</span></p>

        </div>

        <summary class="cursor-pointer select-none p-4 text-sm font-medium">ข้อมูลเพิ่มเติม <span class="text-xs text-muted font-normal">(ไม่บังคับ)</span></summary>

async function saveItem() {
  const d = state.draft;
  if (!d || !d.category || !d.colors.length) return;
  const now = Date.now();
  const item = {
    id: d.id || (crypto.randomUUID ? crypto.randomUUID() : String(now) + Math.random().toString(16).slice(2)),
    image: d.image, category: d.category, colors: d.colors, styles: d.styles,
    name: d.name.trim(), brand: d.brand.trim(), size: d.size.trim(),
    favorite: d.favorite, createdAt: d.createdAt || now, updatedAt: now
  };
  let res;
  try {
    res = await Store.put(item);
  } catch (e) {
    console.error(e);
    return toast(Store === CloudStore ? 'บันทึกขึ้น Cloud ไม่สำเร็จ ลองอีกครั้ง' : 'บันทึกไม่สำเร็จ — ที่เก็บข้อมูลในเครื่องอาจเต็ม', 'warn');
  }
  const i = state.items.findIndex(x => x.id === item.id);
  if (i >= 0) state.items[i] = item; else state.items.push(item);
  const isNew = !d.id;
  closeModal();
  if (res === 'queued') toast('บันทึกแล้ว · จะซิงก์ขึ้น Cloud เมื่อเน็ตกลับมา');
  else toast(isNew ? 'เพิ่มเข้าตู้แล้ว ✓' : 'บันทึกการแก้ไขแล้ว ✓');
  if (isNew && currentPage() !== 'wardrobe') go('wardrobe'); else render();
}

        ${icon('heart', 20, it.favorite ? 'fill="currentColor"' : '')}

      <p class="text-xs text-muted">${cat?.th} · ${cat?.en}</p>
      <h2 class="text-xl font-semibold mt-0.5">${esc(it.name || cat?.th)}</h2>
      ${it.brand || it.size ? `<p class="text-sm text-muted mt-0.5">${[it.brand && esc(it.brand), it.size && 'ไซซ์ ' + esc(it.size)].filter(Boolean).join(' · ')}</p>` : ''}
      <div class="mt-4 flex flex-wrap gap-2">

function confirmBox(title, desc, okLabel, onOk) {
  openModal(`
    <div class="p-6 text-center">
      <div class="mx-auto w-14 h-14 rounded-full bg-[#F3DED5] text-alert grid place-items-center">${icon('alert', 26)}</div>
      <h2 class="mt-3 font-semibold text-lg">${title}</h2>
      <p class="text-sm text-muted mt-1">${desc}</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button data-action="closeModal" class="btn-ghost">ยกเลิก</button>
        <button id="confirm-ok" class="rounded-full bg-alert text-white font-medium py-3">${okLabel}</button>
      </div>
    </div>`);
  document.getElementById('confirm-ok').onclick = onOk;
}

/* =====================================================================
   ปุ่มต่าง ๆ ทั้งแอป (ดักคลิกจุดเดียว ตาม data-action)
   ===================================================================== */
const actions = {
  nav: el => { closeModal(); go(el.dataset.to); },
  openPlus,
  addToCloset: openSourcePicker,
  goShop: () => { closeModal(); go('shop'); },
  takePhoto,
  pickFile: () => document.getElementById('file-gallery').click(),
  capture,
  flipCamera: () => { cameraFacing = cameraFacing === 'environment' ? 'user' : 'environment'; startCamera(); },
  closeModal,
  soon: el => toast(el.dataset.msg || 'เร็ว ๆ นี้'),

  // ตัวแก้ไข
  setCat: el => { state.draft.category = el.dataset.id; renderEditor(); },
  toggleColor: el => { const a = state.draft.colors, id = el.dataset.id; a.includes(id) ? a.splice(a.indexOf(id), 1) : a.push(id); renderEditor(); },
  toggleStyle: el => { const a = state.draft.styles, id = el.dataset.id; a.includes(id) ? a.splice(a.indexOf(id), 1) : a.push(id); renderEditor(); },
  changePhoto: () => { state.draft.replacing = true; isTouchDevice() ? openChangePhotoChoice() : document.getElementById('file-gallery').click(); },
  changeCam: () => document.getElementById('file-camera').click(),
  changeGallery: () => document.getElementById('file-gallery').click(),
  saveItem,

  // รายการเสื้อผ้า
  openItem: el => openItem(el.dataset.id),
  editItem: el => { const it = state.items.find(x => x.id === el.dataset.id); if (it) openEditor(it); },
  toggleFav: async el => {
    const it = state.items.find(x => x.id === el.dataset.id);
    if (!it) return;
    it.favorite = !it.favorite; it.updatedAt = Date.now();
    await Store.put(it);
    if (el.dataset.inModal) openItem(it.id);
    render();
  },
  deleteItem: el => {
    const id = el.dataset.id;
    confirmBox('ลบเสื้อผ้าชิ้นนี้?', 'รูปและข้อมูลของชิ้นนี้จะถูกลบถาวร', 'ลบ', async () => {
      await Store.remove(id);
      state.items = state.items.filter(x => x.id !== id);
      closeModal(); render(); toast('ลบแล้ว');
    });
  },

  // ตัวกรองในตู้
  filterCat: el => { state.filters.cat = el.dataset.id; render(); },
  filterColor: el => { toggleSet(state.filters.colors, el.dataset.id); render(); },
  filterStyle: el => { toggleSet(state.filters.styles, el.dataset.id); render(); },
  toggleMore: () => { state.filters.more = !state.filters.more; render(); },
  clearFilters: () => { Object.assign(state.filters, { cat: 'all', colors: new Set(), styles: new Set(), fav: false, q: '' }); render(); },

  // ข้อมูลส่วนตัว
  exportData: () => {
    const u = Cloud.user;
    const data = {
      app: 'Reweara', exportedAt: new Date().toISOString(),
      account: u ? { uid: u.uid, email: u.email || null, name: u.displayName || null, isGuest: u.isAnonymous } : null,
      items: state.items
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `reweara-data-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('ดาวน์โหลดข้อมูลแล้ว');
  },
  deleteAll: () => confirmBox('ลบข้อมูลทั้งหมด?', `เสื้อผ้า ${state.items.length} ชิ้นจะถูกลบถาวร${Store === CloudStore ? 'จาก Cloud' : 'จากเครื่องนี้'} กู้คืนไม่ได้`, 'ลบทั้งหมด', async () => {
    try { await Store.clear(); } catch (e) { console.error(e); return toast('ลบไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่', 'warn'); }
    state.items = []; closeModal(); render(); toast('ลบข้อมูลทั้งหมดแล้ว');

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset?.field;
  if (f && state.draft) state.draft[f] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset?.change === 'filterFav') { state.filters.fav = e.target.checked; render(); }
});
document.addEventListener('submit', e => {
  const k = e.target.dataset?.submit;
  if (!k) return;
  e.preventDefault();
  if (k === 'homeSearch') {
    state.filters.q = document.getElementById('home-search').value.trim();
    state.filters.cat = 'all';
    go('wardrobe');
  }
  if (k === 'wardrobeSearch') {
    state.filters.q = document.getElementById('wardrobe-search').value.trim();
    render();
  }
});

document.addEventListener('input', e => {

    state.filters.q = e.target.value.trim();
    clearTimeout(window.__qT);
    window.__qT = setTimeout(() => {

});

async function authRun(fn) {
  authUI.loading = true; authUI.error = ''; authUI.info = '';
  renderAuthScreen();
  try { await fn(); }
  catch (e) { console.error(e); if (!SILENT_AUTH.has(e?.code)) authUI.error = authMsg(e); }
  finally { authUI.loading = false; if (!Cloud.user) renderAuthScreen(); }
}

function googleProvider() {
  const p = new Cloud.A.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  return p;
}
const popupBlocked = e => ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e?.code);

async function signInGoogle() {
  const { A } = Cloud;
  try { await A.signInWithPopup(Cloud.auth, googleProvider()); }
  catch (e) { if (popupBlocked(e)) return A.signInWithRedirect(Cloud.auth, googleProvider()); throw e; }
}

async function submitAuthEmail(form) {
  const { A } = Cloud;
  const email = form.email.value.trim(), password = form.password?.value || '';
  authUI.email = email;
  if (!email) { authUI.error = 'กรุณากรอกอีเมล'; return renderAuthScreen(); }
  if (authUI.mode !== 'reset' && password.length < 6) { authUI.error = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; return renderAuthScreen(); }
  await authRun(async () => {
    if (authUI.mode === 'login') await A.signInWithEmailAndPassword(Cloud.auth, email, password);
    if (authUI.mode === 'register') await A.createUserWithEmailAndPassword(Cloud.auth, email, password);
    if (authUI.mode === 'reset') {
      await A.sendPasswordResetEmail(Cloud.auth, email);
      authUI.mode = 'login';
      authUI.info = `ถ้ามีบัญชีของ ${email} ระบบได้ส่งลิงก์ตั้งรหัสใหม่ไปแล้ว (เช็กในกล่องจดหมายขยะด้วย)`;
    }
  });
}

/* ---------- เมื่อสถานะล็อกอินเปลี่ยน ---------- */
const userDocRef = () => Cloud.F.doc(Cloud.db, 'users', Cloud.user.uid);

async function onUser(user) {
  if (Cloud.busy) return;           // กำลังย้ายบัญชีอยู่ ให้ขั้นตอนนั้นจัดการเอง
  Cloud.user = user;
  if (!user) {
    Store = LocalStore;
    state.items = [];
    closeModal();
    renderAuthScreen();
    return;
  }
  Store = CloudStore;
  showSplash();
  withTimeout(Cloud.F.setDoc(userDocRef(), { lastSeenAt: Date.now(), isAnonymous: user.isAnonymous }, { merge: true })).catch(console.error);
  try { state.items = await CloudStore.all(); }
  catch (e) { console.error(e); state.items = []; toast('โหลดข้อมูลจาก Cloud ไม่สำเร็จ ลองรีเฟรชหน้า', 'warn'); }
  authUI.mode = 'choose'; authUI.error = ''; authUI.info = '';
  hideAuthScreen();
  render();
  offerLocalImport();
}

/* ---------- ย้ายเสื้อผ้าจากโหมดในเครื่อง (ขั้นที่ 1) ขึ้น Cloud ---------- */
const flag = { get: k => { try { return localStorage.getItem(k) === '1'; } catch { return false; } },
               set: k => { try { localStorage.setItem(k, '1'); } catch {} } };

async function offerLocalImport() {
  if (flag.get('rw-import-skip')) return;
  let local = [];
  try { local = await LocalStore.all(); } catch {}
  if (!local.length) return;
  openModal(`
    <div class="p-6 text-center">
      <div class="mx-auto w-14 h-14 rounded-full bg-olive-soft text-olive-dark grid place-items-center">${icon('hanger', 26)}</div>
      <h2 class="mt-3 font-semibold text-lg">พบเสื้อผ้า ${local.length} ชิ้นในเครื่องนี้</h2>
      <p class="text-sm text-muted mt-1">ที่บันทึกไว้ก่อนเชื่อมต่อ Cloud ย้ายเข้าบัญชีนี้เลยไหม?</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button data-action="skipImport" class="btn-ghost">ไม่ต้อง</button>
        <button data-action="doImport" class="btn-primary">ย้ายเข้าบัญชี</button>
      </div>
    </div>`);
}
async function doImport(el) {
  el.disabled = true; el.textContent = 'กำลังย้าย...';
  const local = await LocalStore.all();
  for (const it of local) {
    await CloudStore.put(it);
    if (!state.items.some(x => x.id === it.id)) state.items.push(it);
  }
  await LocalStore.clear();
  closeModal(); render();
  toast(`ย้ายเสื้อผ้า ${local.length} ชิ้นเข้าบัญชีแล้ว ✓`);
}

async function afterLinked() {
  await Cloud.auth.currentUser.reload();
  Cloud.user = Cloud.auth.currentUser;
  withTimeout(Cloud.F.setDoc(userDocRef(), { isAnonymous: false, linkedAt: Date.now() }, { merge: true })).catch(console.error);
  closeModal(); render();
  toast('ผูกบัญชีแล้ว ✓ ตู้เสื้อผ้าของคุณปลอดภัย');
}

async function linkGoogle() {
  const { A } = Cloud;
  try {
    await A.linkWithPopup(Cloud.user, googleProvider());
    await afterLinked();
  } catch (e) {
    if (e?.code === 'auth/credential-already-in-use') {
      const cred = A.GoogleAuthProvider.credentialFromError(e);
      if (cred) return confirmMerge(cred, 'บัญชี Google นี้');
    }
    if (popupBlocked(e)) return A.linkWithRedirect(Cloud.user, googleProvider());
    if (!SILENT_AUTH.has(e?.code)) openLinkModal(authMsg(e));
  }
}

async function linkEmail(form) {
  const { A } = Cloud;
  const email = form.email.value.trim(), password = form.password.value;
  if (!email || password.length < 6) return openLinkModal(!email ? 'กรุณากรอกอีเมล' : 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  form.querySelector('[type=submit]').disabled = true;
  try {
    await A.linkWithCredential(Cloud.user, A.EmailAuthProvider.credential(email, password));
    await afterLinked();
  } catch (e) {
    if (['auth/email-already-in-use', 'auth/credential-already-in-use'].includes(e?.code))
      return confirmMerge(A.EmailAuthProvider.credential(email, password), `บัญชี ${email}`);
    openLinkModal(authMsg(e));
  }
}

// บัญชีที่จะผูกมีอยู่แล้ว → ย้ายเสื้อผ้าของ Guest ไปรวมในบัญชีนั้น แล้วลบข้อมูล Guest ทิ้ง
function confirmMerge(cred, label) {
  openModal(`
    <div class="p-6 text-center">
      <div class="mx-auto w-14 h-14 rounded-full bg-olive-soft text-olive-dark grid place-items-center">${icon('user', 26)}</div>
      <h2 class="mt-3 font-semibold text-lg">${esc(label)} มีอยู่แล้ว</h2>
      <p class="text-sm text-muted mt-1">จะย้ายเสื้อผ้า ${state.items.length} ชิ้นของ Guest ไปรวมกับตู้ในบัญชีนั้น แล้วเข้าสู่ระบบให้</p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <button data-action="closeModal" class="btn-ghost">ยกเลิก</button>
        <button id="merge-ok" class="btn-primary">ย้ายและเข้าสู่ระบบ</button>
      </div>
    </div>`);
  document.getElementById('merge-ok').onclick = () => mergeGuestInto(cred);
}

async function mergeGuestInto(cred) {
  const { A } = Cloud;
  const items = [...state.items];
  Cloud.busy = true;
  closeModal();
  showSplash('กำลังย้ายเสื้อผ้าเข้าบัญชี...');
  let err = null;
  try {
    await deleteCloudData();                                  // ลบข้อมูลชุดเดิมของ Guest
    await Cloud.user.delete().catch(() => A.signOut(Cloud.auth));
    try { await A.signInWithCredential(Cloud.auth, cred); }
    catch (e) { err = e; await A.signInAnonymously(Cloud.auth); } // เข้าไม่ได้ → กลับเป็น Guest ใหม่ แต่เสื้อผ้ายังอยู่ครบ
    Cloud.user = Cloud.auth.currentUser;
    for (const it of items) await CloudStore.put(it);
  } catch (e) {
    err = err || e;
    console.error(e);
  }
  Cloud.busy = false;
  await onUser(Cloud.auth.currentUser);
  if (err) toast(`เข้าสู่ระบบไม่สำเร็จ: ${authMsg(err)} — เสื้อผ้ายังอยู่ครบ`, 'warn');
  else toast(`ย้ายเสื้อผ้า ${items.length} ชิ้นเข้าบัญชีแล้ว ✓`);
}

/* ---------- ลบข้อมูล / ออกจากระบบ ---------- */
async function deleteCloudData() {
  await CloudStore.clear();
  await Cloud.F.deleteDoc(userDocRef());
}

async function wipeLocalCacheAndReload() {
  // ล้างสำเนาข้อมูลที่เก็บในเครื่อง เพื่อไม่ให้คนที่ใช้เครื่องต่อเห็นข้อมูล
  try { await Cloud.F.terminate(Cloud.db); await Cloud.F.clearIndexedDbPersistence(Cloud.db); } catch (e) { console.error(e); }
  location.reload();
}

function signOutFlow() {
  const { A } = Cloud;
  if (Cloud.user?.isAnonymous) {
    confirmBox('ออกจากโหมด Guest?', 'บัญชี Guest ยังไม่ได้ผูก ถ้าออกตอนนี้ เสื้อผ้าทั้งหมดจะถูกลบ ถ้าอยากเก็บไว้ ให้กด "ผูกบัญชี" ก่อน', 'ลบและออก', async () => {
      Cloud.busy = true; showSplash('กำลังลบข้อมูล...');
      try { await deleteCloudData(); await Cloud.user.delete(); } catch (e) { console.error(e); await A.signOut(Cloud.auth); }
      await wipeLocalCacheAndReload();
    });
  } else {
    confirmBox('ออกจากระบบ?', 'เสื้อผ้ายังเก็บอยู่ครบบน Cloud เข้าสู่ระบบใหม่เมื่อไรก็เจอตู้เดิม', 'ออกจากระบบ', async () => {
      Cloud.busy = true; showSplash('กำลังออกจากระบบ...');
      await A.signOut(Cloud.auth);
      await wipeLocalCacheAndReload();
    });
  }
}

Object.assign(actions, {
  authGuest: () => authRun(() => Cloud.A.signInAnonymously(Cloud.auth)),
  authGoogle: () => authRun(signInGoogle),
  authMode: el => { authUI.mode = el.dataset.mode; authUI.error = ''; authUI.info = ''; renderAuthScreen(); },
  openLink: () => openLinkModal(),
  linkGoogle,
  signOut: signOutFlow,
  dismissNudge: () => { flag.set('rw-nudge-off'); render(); },
  skipImport: () => { flag.set('rw-import-skip'); closeModal(); },
  doImport
});
document.addEventListener('submit', e => {
  const k = e.target.dataset?.submit;
  if (k === 'authEmail') { e.preventDefault(); submitAuthEmail(e.target); }
  if (k === 'linkEmail') { e.preventDefault(); linkEmail(e.target); }
});

/* ---------- ข้อความแจ้งเตือนสั้น ---------- */
function toast(msg, kind = 'ok') {
  const t = document.getElementById('toast');
  t.className = `fixed left-1/2 -translate-x-1/2 bottom-28 z-[60] fade-in px-4 py-2.5 rounded-full text-sm shadow-lg max-w-[90vw] text-center ${kind === 'warn' ? 'bg-alert text-white' : 'bg-ink text-white'}`;
  t.textContent = msg;
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.add('hidden'), 2600);
}

/* ---------- เริ่มต้นแอป ---------- */
(async function init() {
  hydrateIcons();
  await LocalStore.open(cloudMode());
  if (!cloudMode()) {                 // ยังไม่ได้ตั้งค่า Firebase → ใช้งานแบบเก็บในเครื่อง
    Store = LocalStore;
    try { state.items = await LocalStore.all(); } catch { state.items = []; }
    render();
    return;
  }
  showSplash();
  try {
    await loadFirebase();
  } catch (e) {
    console.error(e);
    showSplash('เชื่อมต่อไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า');
    return;
  }
  Cloud.A.getRedirectResult(Cloud.auth).catch(e => {
    if (e?.code === 'auth/credential-already-in-use') return; // ผูกผ่าน redirect แต่บัญชีมีอยู่แล้ว
    if (!SILENT_AUTH.has(e?.code)) { authUI.error = authMsg(e); if (!Cloud.user) renderAuthScreen(); }
  });
  Cloud.A.onAuthStateChanged(Cloud.auth, onUser);
})();
</script>
